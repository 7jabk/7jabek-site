<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>حجابك</title>
<style>
:root{--green:#2f7445;--green2:#4e8f61;--gold:#c7a85b;--cream:#f7f3ea;--paper:#fffdfa;--ink:#183423;--muted:#77756f;--line:#e8dfcf;--shadow:0 12px 35px rgba(60,72,52,.13)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f7f2e8 0,#fbfaf6 50%,#f4eee3 100%);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
.app{width:min(100%,640px);margin:auto;padding:0 10px 74px}
.hero{position:relative;margin:0 -10px 10px;padding:14px 12px 15px;text-align:center;background:#fff;border-bottom:1px solid #eadfcb}
.logo{display:block;width:148px;max-width:43vw;height:auto;object-fit:contain;margin:0 auto 6px;filter:drop-shadow(0 5px 12px rgba(50,70,45,.09))}
.choose{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:0;font-size:22px;font-weight:800;color:#29452f;text-shadow:0 1px #fff}
.choose:before,.choose:after{content:"";width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.choose:after{transform:scaleX(-1)}
.gates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.gate{position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.9);border-radius:23px;background:#fff;box-shadow:var(--shadow);padding:0;min-height:158px;cursor:pointer}
.gate.active{border-color:#4f9767;box-shadow:0 0 0 3px rgba(60,135,82,.13),var(--shadow)}
.gate img{display:block;width:100%;height:122px;object-fit:cover}
.gate::after{content:"";position:absolute;inset:72px 0 0;background:linear-gradient(transparent 0%,rgba(255,255,255,.7) 42%,#fff 72%)}
.gate-title{position:absolute;z-index:4;right:8px;left:auto;bottom:9px;display:inline-block;width:max-content;max-width:calc(100% - 50px);white-space:nowrap;font-size:clamp(10px,2.8vw,14px);line-height:1.15;font-weight:900;color:#173622;text-align:right;background:rgba(255,255,255,.94);padding:5px 7px;border-radius:9px;box-shadow:0 2px 8px rgba(30,50,35,.08);backdrop-filter:blur(2px)}
.gate-icon{position:absolute;z-index:4;right:8px;top:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#438c58,#2b6f42);border:3px solid rgba(255,255,255,.96);color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(25,79,45,.25)}
.gate-arrow{position:absolute;z-index:4;left:8px;bottom:8px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#77aa83;color:#fff;font-size:17px}
.trusted-gate{grid-column:auto;min-height:158px}
.trusted-preview{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:5px 5px 30px;background:#fff}
.trusted-preview img{width:100%!important;height:100%!important;min-width:0;object-fit:contain!important;background:#fff;border-radius:7px}
.trusted-gate::after{inset:70px 0 0}
.grid.trusted-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.album.trusted-card{grid-template-columns:42% 58%;min-height:118px}
.album.trusted-card img{height:104px;object-fit:contain;background:#fff}
.stage{overflow:hidden;border-radius:25px;background:rgba(255,255,255,.94);border:1px solid var(--line);box-shadow:var(--shadow)}
.stage-head{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 14px;background:linear-gradient(90deg,#fffaf2,#fff,#fffaf2)}
.stage-head::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(208,193,158,.09),transparent 40%,rgba(61,123,76,.07));pointer-events:none}
.stage-icon{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#3d8a54,#2b7042);border:4px solid white;color:white;font-size:27px;box-shadow:0 7px 18px rgba(36,104,58,.22)}
.stage-title{position:relative}
.stage-title h2{margin:0;font-size:30px;color:#285e3b;font-weight:900}
.stage-title p{margin:3px 0 0;color:#8a6f35;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}
.album{min-width:0;position:relative;display:grid;grid-template-columns:46% 54%;align-items:center;gap:5px;min-height:100px;padding:7px;border-radius:16px;background:#fff;border:1px solid #eee7da;box-shadow:0 5px 12px rgba(60,72,52,.08);cursor:pointer;text-align:right}
.album.hide-extra{display:none}
.album img{width:100%;height:86px;object-fit:cover;border-radius:11px;background:#fff}
.album span{font-size:12px;line-height:1.35;font-weight:800;color:#1d2f23;overflow-wrap:anywhere}
.album .arr{position:absolute;left:4px;bottom:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#faf7ee;border:1px solid #decf9f;color:#6b6b5e;font-size:14px}
.explore{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 28px);margin:8px 14px 16px;padding:13px 15px;border:0;border-radius:999px;background:linear-gradient(90deg,#207842,#2f8c50,#1f6c3c);color:white;font-size:20px;font-weight:900;box-shadow:0 10px 20px rgba(34,112,61,.26);cursor:pointer}
.footer{display:flex;align-items:center;justify-content:center;gap:12px;color:#8d8a82;font-size:12px;margin:20px 0 0}
.footer:before,.footer:after{content:"";width:70px;height:1px;background:#d5c9b8}
.wa{position:fixed;z-index:10;left:18px;bottom:17px;background:#15924d;color:#fff;text-decoration:none;border-radius:999px;padding:11px 14px;font-weight:800;box-shadow:0 10px 24px rgba(20,120,65,.28)}
.sheet-bg{position:fixed;z-index:20;inset:0;background:rgba(19,27,20,.5);backdrop-filter:blur(3px);display:none}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:auto;width:min(100%,640px);max-height:88vh;overflow:auto;background:#fffdf8;border-radius:26px 26px 0 0;padding:14px 15px 24px;box-shadow:0 -15px 45px rgba(0,0,0,.22)}
.handle{width:56px;height:6px;border-radius:999px;background:#ded8ca;margin:0 auto 12px}
.close{position:absolute;left:14px;top:13px;width:38px;height:38px;border:0;border-radius:12px;background:#f1ede4;font-size:20px;cursor:pointer}
.detail{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:start}
.detail img{width:160px;aspect-ratio:4/5;object-fit:contain;background:white;border-radius:18px;border:1px solid #eee3d3;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.detail h3{margin:20px 0 7px;font-size:24px;color:#245e39}
.detail p{margin:0;color:#5c655e;font-size:14px;line-height:1.75}
.meta{display:none;margin-top:10px;padding:8px 10px;border-radius:11px;background:#f7f1e2;color:#7b6436;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.actions a,.empty{display:inline-block;text-decoration:none;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:800}
.actions a{background:#2d7d48;color:#fff}
.actions a:nth-child(n+2){background:white;color:#2d7d48;border:1px solid #c9d8cc}
.empty{background:#f2eee5;color:#777}
@media(max-width:460px){
  .choose{font-size:17px;gap:7px}.choose:before,.choose:after{width:30px}
  .gate{min-height:142px}.gate img{height:108px}.gate-icon{top:10px;right:10px;width:38px;height:38px}.gate-title{font-size:clamp(9.8px,2.9vw,12.5px)}
  .stage-title h2{font-size:25px}.stage-icon{width:52px;height:52px}
  .grid{gap:6px;padding:8px 7px}.album{min-height:91px;padding:5px;gap:4px}.album img{height:78px}.album span{font-size:10.5px}
  .explore{font-size:17px}
  .detail{grid-template-columns:124px 1fr;gap:11px}.detail img{width:124px}.detail h3{font-size:20px;margin-top:16px}.detail p{font-size:13px}
}
.brand-phrase{font-size:23px;font-weight:900;color:var(--green);line-height:1.55;margin:1px auto 2px}.choose{margin-top:4px}.explore{display:none!important}@media(max-width:430px){.brand-phrase{font-size:21px}.logo{width:138px}}
@media(max-width:460px){.trusted-preview{height:auto;padding:6px 6px 17px}.trusted-gate{min-height:142px}.album.trusted-card{min-height:105px}.album.trusted-card img{height:92px}}
</style>
</head>

const ORDER=["trade","ilm","faz","trusted"];
const gateMeta={
 trade:["الملابس الشرعية (تجاري)","🛒"],
 ilm:["السلاسل العلمية والدعوية","📖"],
 faz:["منصة الزواج الشرعي","💍"],
 trusted:["صفحات نثق بها","🤝"]
};
let current="ilm", expanded=true;

function renderGates(){
 const g=document.getElementById("gates"); g.innerHTML="";
 ORDER.forEach(k=>{
   const b=document.createElement("button");
   b.className="gate"+(current===k?" active":"")+(k==="trusted"?" trusted-gate":"");
   const visual=k==="trusted"
     ? `<div class="trusted-preview"><img src="${IMAGES.setari}" alt=""><img src="${IMAGES.waqar}" alt=""><img src="${IMAGES.khumur}" alt=""><img src="${IMAGES.rua}" alt=""></div>`
     : `<img src="${GATE_IMAGES[k]}" alt="">`;
   b.innerHTML=visual+`<span class="gate-icon">${gateMeta[k][1]}</span><span class="gate-title">${gateMeta[k][0]}</span><span class="gate-arrow">‹</span>`;
   b.onclick=()=>{current=k;expanded=true;render();document.getElementById("stage").scrollIntoView({behavior:"smooth",block:"start"})};
   g.appendChild(b);
 });
}

function render(){
 renderGates();
 const s=SECTIONS[current];
 document.getElementById("stageIcon").textContent=s.icon;
 document.getElementById("stageTitle").textContent=s.title;
 document.getElementById("stageSub").textContent=s.subtitle;
 const grid=document.getElementById("grid"); grid.innerHTML="";
 grid.className="grid"+(current==="trusted"?" trusted-grid":"");
 s.items.forEach((item,i)=>{
   const b=document.createElement("button");
   b.className="album"+((!expanded && current==="ilm" && i>=9)?" hide-extra":"")+(current==="trusted"?" trusted-card":"");
   b.innerHTML=`<img src="${IMAGES[item.id]}" alt="${item.title}" onerror="this.style.display='none'"><span>${item.title}</span><i class="arr">‹</i>`;
   b.onclick=()=>openItem(item);
   grid.appendChild(b);
 });
 const btn=document.getElementById("exploreBtn");
 btn.style.display="none";
}

function openItem(item){
 document.getElementById("detailImg").src=IMAGES[item.id];
 document.getElementById("detailTitle").textContent=item.title;
 document.getElementById("detailDesc").textContent=item.desc||"";
 const meta=document.getElementById("detailMeta");
 if(item.meta){meta.textContent=item.meta;meta.style.display="block"} else meta.style.display="none";
 const a=document.getElementById("detailActions"); a.innerHTML="";
 if(item.actions && item.actions.length){
   item.actions.forEach(x=>{const link=document.createElement("a");link.href=x[1];link.target="_blank";link.rel="noopener";link.textContent=x[0];a.appendChild(link)})
 } else {
   const e=document.createElement("span");e.className="empty";e.textContent="محتوى متجدد — لا يوجد رابط ثابت حاليًا";a.appendChild(e)
 }
 document.getElementById("sheetBg").classList.add("open");document.body.style.overflow="hidden";
}
function closeSheet(){document.getElementById("sheetBg").classList.remove("open");document.body.style.overflow=""}
render();
</script>
